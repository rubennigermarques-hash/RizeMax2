<!-- 
Exemplos de SVGs inline para usar no site RizeMax
Copie e cole nos arquivos HTML conforme necessário
-->

<!-- Logo RizeMax (para usar no header) -->
<svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
        </linearGradient>
    </defs>
    <text x="10" y="28" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="url(#logoGradient)">
        RizeMax
    </text>
    <text x="10" y="38" font-family="Inter, sans-serif" font-size="8" fill="rgba(255,255,255,0.8)">
        Power Solutions
    </text>
</svg>

<!-- Ícone de Energia (para usar no hero) -->
<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="energyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#feca57"/>
            <stop offset="100%" style="stop-color:#ff6b6b"/>
        </linearGradient>
    </defs>
    <circle cx="40" cy="40" r="35" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <path d="M25 30 L45 15 L38 35 L55 35 L35 55 L42 35 L25 35 Z" fill="url(#energyGradient)"/>
</svg>

<!-- Ícones para Certificações -->
<!-- ISO 9001 -->
<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="28" fill="#4ecdc4" stroke="#fff" stroke-width="2"/>
    <text x="30" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">ISO</text>
    <text x="30" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">9001</text>
</svg>

<!-- ANEEL -->
<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="5" width="50" height="50" rx="8" fill="#667eea" stroke="#fff" stroke-width="2"/>
    <path d="M15 25 L30 15 L45 25 L45 40 L15 40 Z" fill="white"/>
    <circle cx="30" cy="30" r="8" fill="#667eea"/>
    <path d="M25 30 L35 30 M30 25 L30 35" stroke="white" stroke-width="2"/>
</svg>

<!-- Ícone de Produto Genérico -->
<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="productGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea"/>
            <stop offset="100%" style="stop-color:#764ba2"/>
        </linearGradient>
    </defs>
    <rect width="200" height="150" fill="url(#productGradient)"/>
    <rect x="40" y="30" width="120" height="80" rx="8" fill="rgba(255,255,255,0.9)"/>
    <rect x="50" y="40" width="100" height="8" fill="#667eea" opacity="0.3"/>
    <rect x="50" y="55" width="80" height="8" fill="#667eea" opacity="0.3"/>
    <rect x="50" y="70" width="60" height="8" fill="#667eea" opacity="0.3"/>
    <circle cx="160" cy="95" r="8" fill="#4ecdc4"/>
</svg>

<!-- Background Pattern (para usar como textura) -->
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#grid)"/>
</svg>

<!-- Ícones para Features -->
<!-- Qualidade -->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" fill="#4ecdc4"/>
    <path d="M12 20 L18 26 L28 14" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<!-- Entrega -->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="15" width="20" height="15" rx="2" fill="#667eea"/>
    <circle cx="12" cy="32" r="3" fill="#feca57"/>
    <circle cx="28" cy="32" r="3" fill="#feca57"/>
    <rect x="25" y="20" width="10" height="10" rx="2" fill="#667eea"/>
    <path d="M8 12 L15 12 L18 18" stroke="#667eea" stroke-width="2" fill="none"/>
</svg>

<!-- Suporte -->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" fill="#ff6b6b"/>
    <circle cx="20" cy="18" r="8" fill="white"/>
    <rect x="15" y="25" width="10" height="8" rx="2" fill="white"/>
    <circle cx="14" cy="16" r="2" fill="#ff6b6b"/>
    <circle cx="26" cy="16" r="2" fill="#ff6b6b"/>
</svg>

<!-- Preços -->
<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" fill="#feca57"/>
    <text x="20" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">$</text>
</svg>

<!-- Pattern de Background Avançado -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.1"/>
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.1"/>
        </linearGradient>
        <pattern id="dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
            <circle cx="25" cy="25" r="2" fill="rgba(255,255,255,0.1)"/>
        </pattern>
    </defs>
    <rect width="400" height="400" fill="url(#bgGradient)"/>
    <rect width="400" height="400" fill="url(#dots)"/>
    <polygon points="0,400 200,0 400,400" fill="rgba(255,255,255,0.02)"/>
</svg>
